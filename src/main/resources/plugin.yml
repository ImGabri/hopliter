name: Hopliter
version: '1.3.2'
main: com.example.helditemfixture.HopliterPlugin
api-version: '1.21.11'
description: Copies the stack from the first hotbar slot for authorized players.
commands:
  hoplitercopy:
    description: Copy hotbar slot 1 into an empty inventory slot.
    usage: /hoplitercopy [auto|1-35]
    permission: hopliter.copy
permissions:
  hopliter.copy:
    description: Allows copying a stack in your own inventory.
    default: op
